<div class="main-content">
    <div class=" section-content section-content-p30">
        <div class="container-fluid">
            <div class="product-grid">
                <div *ngFor="let grid of products | async" class="product-grid-item">
                    <div class="product-box">
                        <img src={{grid.imageUrl}} class="img-responsive">
                        <h1>{{ grid.productName }}</h1>
                        <div class="price">{{ grid.productPrice | currency:'INR' }}</div>
                        <a href="#" class="primary-btn" (click)="addToCart(grid)">Add to cart</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<p *ngIf="loadError" role="alert">Products could not be loaded. Check the API connection and try again.</p>
<p *ngIf="saveError" role="alert">Product could not be saved. Your changes are still available to retry.</p>
